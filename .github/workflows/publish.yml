name: Publish to Chrome Web Store

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Set CI version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p='src/manifest.json'; const m=JSON.parse(fs.readFileSync(p)); m.version='1.0.${GITHUB_RUN_NUMBER}'; fs.writeFileSync(p, JSON.stringify(m, null, 4)+'\\n');"
          sed -i "s/>dev</>${GITHUB_SHA:0:7}</" src/popup.html
      - run: npm run build
      - run: npm run zip

      - name: Authenticate with Google Cloud
        id: google-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload extension
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:upload"

      - name: Publish extension
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:publish"
