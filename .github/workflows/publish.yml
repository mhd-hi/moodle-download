name: Publish to Chrome Web Store

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Set CI version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p='src/manifest.json'; const m=JSON.parse(fs.readFileSync(p)); m.version='1.0.${GITHUB_RUN_NUMBER}'; fs.writeFileSync(p, JSON.stringify(m, null, 4)+'\\n');"
      - run: npm run build
      - run: npm run zip

      - uses: mnao305/chrome-extension-upload@4008e29e13c144d0f6725462cbd49b7c291b4928 # v5
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true
