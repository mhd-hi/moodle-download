<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Downloader</title>
    <style>
        body {
            width: 400px;
            min-height: 300px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.4;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .icon {
            font-size: 20px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 32px 16px;
            text-align: center;
            color: #666;
            min-height: 120px;
        }

        .scan-progress {
            font-size: 13px;
            color: #0891b2;
            font-weight: 500;
            text-align: center;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #e0e0e0;
            border-top: 2px solid #1976d2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            padding: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #dc2626;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .file-count {
            font-size: 13px;
            color: #666;
        }

        .select-controls {
            display: flex;
            gap: 8px;
        }

        .select-btn {
            padding: 4px 8px;
            font-size: 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        .files-container {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .file-group {
            margin-bottom: 16px;
        }

        .folder-header {
            font-weight: 600;
            font-size: 13px;
            color: #374151;
            margin-bottom: 8px;
            padding: 6px 8px;
            background: #f9fafb;
            border-radius: 4px;
            border-left: 3px solid #1976d2;
        }

        .file-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .file-item:hover {
            background: #f9fafb;
        }

        .file-checkbox {
            margin-top: 2px;
            cursor: pointer;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-title {
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 2px;
            word-wrap: break-word;
        }

        .file-url {
            font-size: 11px;
            color: #666;
            word-wrap: break-word;
            overflow: hidden;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .file-size {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .file-size.too-large {
            color: #dc2626;
            font-weight: 500;
        }

        .file-item.disabled {
            opacity: 0.6;
            background: #f9f9f9;
        }

        .file-item.disabled .file-title {
            color: #666;
            text-decoration: line-through;
        }

        .file-item.disabled .file-checkbox {
            cursor: not-allowed;
        }

        .download-section {
            border-top: 1px solid #e0e0e0;
            padding-top: 16px;
        }

        .download-btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: #1976d2;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover:not(:disabled) {
            background: #1565c0;
        }

        .download-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .download-btn.downloading {
            background: #059669;
        }

        .no-files {
            text-align: center;
            padding: 32px 16px;
            color: #666;
        }

        .no-files .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .download-errors {
            margin-top: 12px;
            padding: 12px;
            background: #fef3cd;
            border: 1px solid #fbbf24;
            border-radius: 6px;
            font-size: 13px;
        }

        .error-summary .success-info {
            color: #059669;
            margin-bottom: 4px;
        }

        .error-summary .error-info {
            color: #dc2626;
            margin-bottom: 8px;
        }

        .error-summary .info-message {
            color: #0f766e;
            background: #f0fdfa;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            border-left: 3px solid #14b8a6;
        }

        .error-details {
            margin-top: 8px;
        }

        .error-details summary {
            cursor: pointer;
            font-weight: 500;
            color: #374151;
            padding: 4px 0;
        }

        .error-details summary:hover {
            color: #1f2937;
        }

        .error-details ul {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }

        .error-details li {
            margin-bottom: 4px;
            color: #6b7280;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="icon">📥</span>
        <h1>Moodle Downloader</h1>
    </div>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>Scanning page for files...</div>
        <div id="scan-progress" class="scan-progress" style="display: none;">Found <span id="found-count">1</span> files
        </div>
    </div>

    <div id="error" class="error" style="display: none;">
        <div id="error-message"></div>
    </div>

    <div id="content" style="display: none;">
        <div class="controls">
            <div class="file-count">
                <span id="selected-count">0</span> of <span id="total-count">0</span> files selected
            </div>
            <div class="select-controls">
                <button id="select-all" class="select-btn">Select All</button>
                <button id="select-none" class="select-btn">Select None</button>
            </div>
        </div>

        <div id="files-container" class="files-container"></div>

        <div class="download-section">
            <button id="download-btn" class="download-btn">
                <span class="icon">📦</span>
                <span id="download-text">Download as ZIP</span>
            </button>
        </div>
    </div>

    <div id="no-files" class="no-files" style="display: none;">
        <div class="icon">📄</div>
        <div>No downloadable files found on this page</div>
        <div style="font-size: 12px; margin-top: 8px; color: #999;">
            Make sure you're on a Moodle course page or refresh the page.
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
