<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Downloader</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <div class="brand">
            <span class="icon">📥</span>
            <h1>Moodle Downloader</h1>
        </div>
        <a class="github-link" href="https://github.com/mhd-hi/moddle-download" target="_blank" rel="noopener" title="View on GitHub">
            <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <span class="commit-sha" title="Build commit">dev</span>
    </div>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>Scanning page for files...</div>
        <div id="scan-progress" class="scan-progress" style="display: none;">Found <span id="found-count">1</span> files
        </div>
    </div>

    <div id="scan-start" class="scan-start">
        <div class="icon">📚</div>
        <div>Ready to scan this Moodle page</div>
        <button id="scan-page-btn" class="scan-page-btn">Scan current page</button>
    </div>

    <div id="error" class="error" style="display: none;">
        <div id="error-message"></div>
    </div>

    <div id="content" style="display: none;">
        <div class="controls">
            <div class="file-count">
                <span id="selected-count">0</span> of <span id="total-count">0</span> files selected
            </div>
            <div class="select-controls">
                <button id="select-all" class="select-btn" title="Select all files, including already-downloaded ones">Select All</button>
                <button id="select-none" class="select-btn" title="Deselect all files">Select None</button>
                <button id="forget-history" class="select-btn link" title="Clear remembered downloads — all files become new again">Forget</button>
            </div>
        </div>

        <div class="settings">
            <label class="setting-toggle" title="Unselect files you already downloaded">
                <input type="checkbox" id="remember-toggle" checked>
                <span>Skip already-downloaded</span>
            </label>
        </div>

        <div id="files-container" class="files-container"></div>

        <div class="download-section">
            <button id="download-btn" class="download-btn">
                <span class="icon">📦</span>
                <span id="download-text">Download as ZIP</span>
            </button>
            <button id="cancel-btn" class="cancel-btn" style="display: none;">Cancel</button>
        </div>
    </div>

    <div id="no-files" class="no-files" style="display: none;">
        <div class="icon">📄</div>
        <div>No downloadable files found on this page</div>
        <div style="font-size: 12px; margin-top: 8px; color: #999;">
            Make sure you're on a Moodle course page or refresh the page.
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
